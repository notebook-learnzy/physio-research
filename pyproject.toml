[project]
name = "physio-research"
version = "0.1.0"
description = "Autonomous research agent for HRV/sleep hypothesis validation"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.26.0",
    "anthropic>=0.28.0",
    "tenacity>=8.2.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
